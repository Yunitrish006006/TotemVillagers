name: Publish Modrinth
on:
  push:
    branches: [main]
    paths: [gradle.properties, .github/workflows/publish-modrinth.yml]
  workflow_dispatch:
    inputs:
      dry_run: {description: Validate without publishing, required: true, default: true, type: boolean}
permissions: {contents: write, actions: read}
concurrency: {group: 'modrinth-${{ github.workflow }}-${{ github.ref }}', cancel-in-progress: false}
env:
  MODULE_ID: totem-villagers
  CORE_REF: 424b90dc3929caa8c1afcfca7e63c50a64bde669
  REMNANT_REF: 5cbf0dde947862c5ebf9bb81cee47c8d4b3a9648
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: release
        shell: bash
        env: {EVENT_NAME: '${{ github.event_name }}', BEFORE_SHA: '${{ github.event.before }}', REQUESTED_DRY_RUN: '${{ inputs.dry_run }}'}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^mod_version=//p' gradle.properties)"; test -n "$current"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then echo 'should_publish=true' >> "$GITHUB_OUTPUT"; echo "dry_run=${REQUESTED_DRY_RUN}" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null || true)"; previous="$(git show "${BEFORE_SHA}:gradle.properties" 2>/dev/null | sed -n 's/^mod_version=//p' || true)"
          if grep -Fxq '.github/workflows/publish-modrinth.yml' <<<"$changed" || [[ -z "$previous" || "$previous" != "$current" ]]; then echo 'should_publish=true' >> "$GITHUB_OUTPUT"; echo 'dry_run=false' >> "$GITHUB_OUTPUT"; else echo 'should_publish=false' >> "$GITHUB_OUTPUT"; echo 'dry_run=false' >> "$GITHUB_OUTPUT"; fi
      - name: Require exact-source release gates
        id: gates
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "source=$release_sha" >> "$GITHUB_OUTPUT"
          for workflow in build.yml; do
            passed=false
            for attempt in {1..360}; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${release_sha}&event=push&per_page=10")"
              latest="$(jq -c '.workflow_runs | sort_by(.run_number) | last // null' <<<"$runs")"
              if [[ "$(jq -r '.status // empty' <<<"$latest")" == completed ]]; then
                jq -e --arg sha "$release_sha" --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_sha==$sha and .event=="push" and .repository.full_name==$repo' <<<"$latest" >/dev/null
                if [[ "$workflow" == build.yml ]]; then
                  echo "run_id=$(jq -er .id <<<"$latest")" >> "$GITHUB_OUTPUT"
                  echo "run_attempt=$(jq -er .run_attempt <<<"$latest")" >> "$GITHUB_OUTPUT"
                fi
                passed=true
                break
              fi
              sleep 10
            done
            test "$passed" = true || { echo "Timed out waiting for ${workflow}; refusing publication." >&2; exit 1; }
          done

      - name: Resolve immutable artifact identity
        id: artifact
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "release-${RELEASE_SHA}-${BUILD_RUN_ATTEMPT}" --arg run "$BUILD_RUN_ID" --arg source "$RELEASE_SHA" '[.[].artifacts[] | select(.name==$name)] | select(length==1) | .[0] | select(.expired==false and .size_in_bytes>0 and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$source) | .id' <<<"$artifacts")"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Build artifact
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true
          path: build/libs
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable artifact provenance and SHA512
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          expected_sha="$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          core_sha="$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          test "$sha" = "$expected_sha"
          dependency_sha="$(jq -er .remnant_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$RELEASE_SHA" --arg run "$BUILD_RUN_ID" --arg attempt "$BUILD_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core "$CORE_REF" --arg core_sha "$core_sha" --arg dependency_source "$REMNANT_REF" --arg dependency_sha "$dependency_sha" '.repository==$repo and .source_commit==$source and .run_id==$run and .run_attempt==$attempt and .version==$version and .artifact==$artifact and .sha512==$sha and .core_version=="0.7.23" and .core_source_commit==$core and .core_artifact_sha512==$core_sha and .remnant_source_commit==$dependency_source and .remnant_version=="0.2.27" and .remnant_artifact_sha512==$dependency_sha' build/libs/build-provenance.json >/dev/null

      - name: Publish and verify
        id: modrinth
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env: {DRY_RUN: '${{ steps.release.outputs.dry_run }}', MODRINTH_TOKEN: '${{ secrets.MODRINTH_TOKEN }}', MODRINTH_PROJECT_ID: '${{ secrets.MODRINTH_PROJECT_ID }}'}
        run: |
          set -euo pipefail
          v="$(sed -n 's/^mod_version=//p' gradle.properties)"; a="$(sed -n 's/^archives_base_name=//p' gradle.properties)"; mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"; artifact="build/libs/${a}-${v}.jar"
          test -n "$MODRINTH_TOKEN"; test -n "$MODRINTH_PROJECT_ID"; test -f "$artifact"; unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json
          jq -e --arg id "$MODULE_ID" --arg v "$v" --arg mc "~${mc}" --arg core '>=0.7.23 <0.8.0' --arg remnant '>=0.2.13' '.id==$id and .version==$v and .depends.minecraft==$mc and .depends["totem-core"]==$core and .suggests["totem-remnant"]==$remnant' /tmp/fabric.mod.json >/dev/null
          api=https://api.modrinth.com/v2; args=(--fail --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: Yunitrish006006/${MODULE_ID}-publisher/2.0")
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" >/tmp/project.json; p="$(jq -er .id /tmp/project.json)"; sha="$(sha512sum "$artifact"|awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${v}.json")" || { echo "Release JAR SHA-512 differs from validated artifact: $sha" >&2; exit 1; }
          if [[ "$DRY_RUN" == true ]]; then echo "version=$v" >> "$GITHUB_OUTPUT"; echo "sha512=$sha" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl "${args[@]}" "$api/project/${p}/version?include_changelog=false" >/tmp/versions.json; count="$(jq --arg v "$v" '[.[]|select(.version_number==$v)]|length' /tmp/versions.json)"
          if [[ "$count" != 0 ]]; then test "$count" = 1; id="$(jq -er --arg v "$v" '.[]|select(.version_number==$v)|.id' /tmp/versions.json)"; rsha="$(jq -er --arg v "$v" '.[]|select(.version_number==$v)|(([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512)' /tmp/versions.json)"; test "$rsha" = "$sha" || exit 1; else c="$(cat ".github/staging/modrinth-changelog-${v}.md")"; data="$(jq -nc --arg n "${MODULE_ID} ${v}" --arg v "$v" --arg c "$c" --arg p "$p" --arg mc "$mc" '{name:$n,version_number:$v,changelog:$c,dependencies:[{project_id:"P7dR8mSH",dependency_type:"required"},{file_name:"totem-core-0.7.23.jar",dependency_type:"required"},{file_name:"totem-remnant-0.2.27.jar",dependency_type:"optional"}],game_versions:[$mc],version_type:"release",loaders:["fabric"],featured:false,status:"listed",project_id:$p,file_parts:["primary"],primary_file:"primary",environment:"client_and_server"}')"; printf '%s\n' "$data" >/tmp/version-create.json; curl "${args[@]}" -X POST "$api/version" -F 'data=</tmp/version-create.json;type=application/json' -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" >/tmp/version.json; id="$(jq -er .id /tmp/version.json)"; fi
          curl "${args[@]}" "$api/version/$id" >/tmp/remote.json
          jq -e --arg p "$p" --arg v "$v" --arg mc "$mc" --arg f "$(basename "$artifact")" --arg sha "$sha" '.project_id==$p and .version_number==$v and .game_versions==[$mc] and .loaders==["fabric"] and (([.files[]|select(.primary==true)][0]//.files[0]).filename==$f) and (([.files[]|select(.primary==true)][0]//.files[0]).hashes.sha512==$sha)' /tmp/remote.json >/dev/null
          jq -e --rawfile notes ".github/staging/modrinth-changelog-${v}.md" '(.dependencies|length)==3 and any(.dependencies[]; .project_id=="P7dR8mSH" and .dependency_type=="required") and any(.dependencies[]; .project_id==null and .version_id==null and (.file_name=="totem-core-0.7.23.jar" or .file_name==null) and .dependency_type=="required") and any(.dependencies[]; .project_id==null and .version_id==null and (.file_name=="totem-remnant-0.2.27.jar" or .file_name==null) and .dependency_type=="optional") and ((.changelog|sub("\n+$";""))==($notes|sub("\n+$";"")))' /tmp/remote.json >/dev/null
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "version_id=$id" >> "$GITHUB_OUTPUT"; echo "sha512=$sha" >> "$GITHUB_OUTPUT"
      - name: Record verified publication
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.dry_run == 'false'
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', MOD_VERSION: '${{ steps.modrinth.outputs.version }}', VERSION_ID: '${{ steps.modrinth.outputs.version_id }}', SHA512: '${{ steps.modrinth.outputs.sha512 }}'}
        run: |
          set -euo pipefail
          marker=".github/staging/modrinth-published-${MOD_VERSION}.json"; api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker}"; body="$(jq -n --arg v "$MOD_VERSION" --arg id "$VERSION_ID" --arg sha "$SHA512" --arg run "$GITHUB_RUN_ID" '{version:$v,modrinth_version_id:$id,sha512:$sha,verified_by_run:$run}')"; enc="$(printf '%s\n' "$body"|base64 -w0)"; old="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api"|jq -r '.sha//empty')"; payload="$(jq -n --arg m "release: record Modrinth ${MOD_VERSION}" --arg c "$enc" --arg b "$GITHUB_REF_NAME" --arg s "$old" 'if $s=="" then {message:$m,content:$c,branch:$b} else {message:$m,content:$c,branch:$b,sha:$s} end')"; curl --fail -sS -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
