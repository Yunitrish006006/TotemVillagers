name: Dispatch Live Modrinth Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-live-modrinth.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch live Modrinth publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-modrinth.yml --ref "${GITHUB_REF_NAME}" -f dry_run=false
